<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#EDEDED">
<title>群聊解密</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="lobby">
<div class="stage">
  <div class="phone">
    <div class="statusbar">
      <span class="clock">06:15</span>
      <span class="statusbar-right">
        <svg class="sig" viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="6" width="3" height="6" rx="1"/><rect x="9" y="3.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="1" width="3" height="11" rx="1"/></svg>
        <svg class="wifi" viewBox="0 0 16 12" width="16" height="12"><path d="M8 10.4a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/><path d="M4.8 7.2a4.5 4.5 0 0 1 6.4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 4.4a8.5 8.5 0 0 1 12 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="battery"><i></i></span>
      </span>
    </div>

    <header class="nav">
      <div class="nav-title">群聊解密</div>
    </header>

    <main class="conv-list" id="list" aria-busy="true" aria-live="polite">
      <p class="sr-only">正在加载剧本</p>
      <noscript><div class="conv-state"><b>需要开启 JavaScript</b>剧本列表由页面脚本从本地服务读取。</div></noscript>
    </main>

    <nav class="tabbar" aria-hidden="true">
      <span class="tab on">
        <svg viewBox="0 0 24 24"><path d="M12 4.2c-5 0-9 3.1-9 6.9 0 2.2 1.3 4.1 3.3 5.4l-.8 3.9 4-2c.8.2 1.6.3 2.5.3 5 0 9-3.1 9-6.9s-4-7.6-9-7.6Z"/></svg>
        微信
      </span>
      <span class="tab">
        <svg viewBox="0 0 24 24"><circle cx="14.6" cy="8.6" r="2.9"/><path d="M9.4 18.4c0-2.7 2.3-4.7 5.2-4.7s5.2 2 5.2 4.7Z"/><circle cx="7.4" cy="9.4" r="2.4"/><path d="M2.2 17.8c0-2.3 1.9-4 4.4-4 .8 0 1.6.2 2.2.5"/></svg>
        通讯录
      </span>
      <span class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m15.5 8.5-1.9 5.1-5.1 1.9 1.9-5.1Z"/></svg>
        发现
      </span>
      <span class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.5"/><path d="M4.6 19.8c0-3.6 3.3-6.1 7.4-6.1s7.4 2.5 7.4 6.1Z"/></svg>
        我
      </span>
    </nav>
  </div>

  <div class="outside">
    <div class="outside-sub">选一个群进去。你的每一句话都会有人回应</div>
    <details class="outside-note">
      <summary>新增剧本</summary>
      <p>在 <code>scenarios/</code> 下建一个文件夹，放 <code>scenario.json</code> + <code>canon.md</code> + <code>style.md</code> + <code>pacing.md</code>，再把 id 写进 <code>scenarios/index.json</code>。不需要改任何代码。</p>
    </details>
  </div>
</div>

<script>
(function () {
  var list = document.getElementById('list');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function clear() {
    while (list.firstChild) list.removeChild(list.firstChild);
  }

  function setBusy(on) {
    list.setAttribute('aria-busy', on ? 'true' : 'false');
  }

  /* 头像底色偏亮时改用深色字，保证首字可读 */
  function readableOn(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return '#fff';
    var ch = function (i) { return parseInt(h.slice(i, i + 2), 16) / 255; };
    var lin = function (c) { return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
    var L = .2126 * lin(ch(0)) + .7152 * lin(ch(2)) + .0722 * lin(ch(4));
    return L > .60 ? '#2B2B2B' : '#fff';
  }

  /* 群头像：接口给的四个成员首字，2×2 拼图 */
  function avatar(s) {
    var box = el('div', 'conv-av');
    box.setAttribute('aria-hidden', 'true');

    var members = (s.avatars || []).slice(0, 4);
    if (!members.length) {
      box.setAttribute('data-n', '1');
      var solo = el('i', null, String(s.title || '?').slice(0, 1));
      solo.style.background = '#B9B9B9';
      box.appendChild(solo);
      return box;
    }

    box.setAttribute('data-n', String(members.length));
    members.forEach(function (m) {
      var cell = el('i', null, m.a || '?');
      cell.style.background = 'linear-gradient(145deg,' + (m.c1 || '#8a8a8a') + ',' + (m.c2 || '#5f5f5f') + ')';
      cell.style.color = readableOn(m.c1);
      box.appendChild(cell);
    });
    return box;
  }

  function rowFor(s) {
    var title = s.title || s.id;
    var a = el('a', 'conv');
    a.href = '/play.html?s=' + encodeURIComponent(s.id);
    a.setAttribute('aria-label', '进入剧本：' + title);
    if (s.subtitle) a.title = s.subtitle;

    a.appendChild(avatar(s));

    var body = el('div', 'conv-body');
    body.appendChild(el('div', 'conv-name', title));

    var preview = s.preview && s.preview.text
      ? (s.preview.who ? s.preview.who + '：' : '') + s.preview.text
      : (s.subtitle || '');
    if (preview) body.appendChild(el('p', 'conv-preview', preview));
    a.appendChild(body);

    if (s.preview && s.preview.time) a.appendChild(el('span', 'conv-time', s.preview.time));
    return a;
  }

  function skeleton() {
    var frag = document.createDocumentFragment();
    for (var k = 0; k < 3; k++) {
      var row = el('div', 'conv sk');
      row.setAttribute('aria-hidden', 'true');
      row.appendChild(el('div', 'conv-av'));
      var body = el('div', 'conv-body');
      [[46, 12], [72, 10]].forEach(function (spec) {
        var bar = el('div', 'sk-bar');
        bar.style.width = spec[0] + '%';
        bar.style.height = spec[1] + 'px';
        body.appendChild(bar);
      });
      row.appendChild(body);
      frag.appendChild(row);
    }
    return frag;
  }

  function state(title, bodyNodes) {
    var box = el('div', 'conv-state');
    box.appendChild(el('b', null, title));
    (bodyNodes || []).forEach(function (n) { box.appendChild(n); });
    return box;
  }

  function errorState(e) {
    var line = el('span', null, '这个页面要靠本地服务提供剧本列表。确认终端里的服务还在运行，然后重试。');
    var nodes = [line];
    if (e && e.message) nodes.push(el('span', 'sr-only', e.message));
    var box = state('连不上本地服务', nodes);
    var btn = el('button', 'conv-retry', '重试');
    btn.type = 'button';
    btn.addEventListener('click', load);
    box.appendChild(btn);
    return box;
  }

  function emptyState() {
    var p = el('span');
    p.appendChild(document.createTextNode('在 '));
    p.appendChild(el('code', null, 'scenarios/'));
    p.appendChild(document.createTextNode(' 下建好剧本，再把 id 写进 '));
    p.appendChild(el('code', null, 'scenarios/index.json'));
    p.appendChild(document.createTextNode('，这里就会出现。'));
    return state('还没有剧本', [p]);
  }

  function load() {
    clear();
    setBusy(true);
    list.appendChild(skeleton());

    fetch('/api/scenarios', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('GET /api/scenarios → ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var arr = (data && data.scenarios) || [];
        clear();
        if (!arr.length) { list.appendChild(emptyState()); }
        else { arr.forEach(function (s) { list.appendChild(rowFor(s)); }); }
        setBusy(false);
      })
      .catch(function (e) {
        clear();
        list.appendChild(errorState(e));
        setBusy(false);
      });
  }

  load();
})();
</script>
</body>
</html>
