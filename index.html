<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群聊解密</title>
<style>
  :root{
    --ink:#e8f1ea; --muted:#8fa397; --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 700px at 20% 0%, #24303b 0%, #12171d 45%, #0a0d11 100%);
    display:flex;align-items:center;justify-content:center;padding:40px 20px;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(900px 500px at 70% 110%, rgba(7,193,96,.10), transparent 60%)}
  .wrap{position:relative;z-index:1;width:100%;max-width:680px}
  .head{margin-bottom:26px}
  .kicker{font-size:11px;letter-spacing:6px;color:#4b6b5a;margin-bottom:12px}
  h1{font-size:26px;font-weight:500;letter-spacing:2px;margin:0 0 8px}
  .sub{font-size:13px;color:var(--muted);letter-spacing:.5px}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:26px}
  .card{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    transition:.18s;
  }
  .card:hover{border-color:rgba(7,193,96,.45);background:rgba(7,193,96,.06);transform:translateY(-1px)}
  .cover{width:52px;height:52px;flex:0 0 52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:rgba(7,193,96,.10);border:1px solid rgba(7,193,96,.18)}
  .card-body{flex:1;min-width:0}
  .card-title{font-size:16px;letter-spacing:.5px;margin-bottom:4px}
  .card-sub{font-size:12.5px;color:var(--muted);line-height:1.5}
  .go{font-size:12px;color:#5f8f72;border:1px solid rgba(7,193,96,.25);border-radius:20px;padding:4px 12px;white-space:nowrap}
  .empty{border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8}
  .foot{margin-top:26px;font-size:11.5px;color:#5d6b64;line-height:1.9}
  .foot code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;font-size:11px}
  .err{color:#c98b8b}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">CHAT MYSTERY</div>
    <h1>群聊解密</h1>
    <div class="sub">选一个剧本进去。里面的每个人都会根据你说的话回应。</div>
  </div>

  <div class="list" id="list">
    <div class="empty">正在加载剧本…</div>
  </div>

  <div class="foot">
    想加新剧本：在 <code>scenarios/</code> 下建一个文件夹，放 <code>scenario.json</code> +
    <code>canon.md</code> + <code>style.md</code> + <code>pacing.md</code>，再把 id 写进
    <code>scenarios/index.json</code>。不需要改任何代码。
  </div>
</div>

<script>
(async function () {
  const list = document.getElementById('list');
  let data;
  try {
    const r = await fetch('/api/scenarios');
    data = await r.json();
  } catch (e) {
    list.innerHTML = '<div class="empty err">连不上本地服务：' + e.message + '</div>';
    return;
  }
  const arr = (data && data.scenarios) || [];
  if (!arr.length) {
    list.innerHTML = '<div class="empty">还没有剧本。<br>去 <code>scenarios/</code> 里放一个试试。</div>';
    return;
  }
  list.innerHTML = '';
  arr.forEach(function (s) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/play.html?s=' + encodeURIComponent(s.id);
    const cov = document.createElement('div');
    cov.className = 'cover';
    cov.textContent = s.cover || '💬';
    const body = document.createElement('div');
    body.className = 'card-body';
    const t = document.createElement('div');
    t.className = 'card-title';
    t.textContent = s.title || s.id;
    const sub = document.createElement('div');
    sub.className = 'card-sub';
    sub.textContent = s.subtitle || '';
    body.appendChild(t);
    body.appendChild(sub);
    const go = document.createElement('div');
    go.className = 'go';
    go.textContent = '进入 →';
    a.appendChild(cov);
    a.appendChild(body);
    a.appendChild(go);
    list.appendChild(a);
  });
})();
</script>
</body>
</html>
