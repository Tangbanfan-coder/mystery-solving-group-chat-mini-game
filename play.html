<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日出小队</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="bezel-glow"></div>

    <!-- 状态栏 -->
    <div class="statusbar">
      <span class="clock" id="clock">06:15</span>
      <span class="statusbar-right">
        <svg class="sig" viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="6" width="3" height="6" rx="1"/><rect x="9" y="3.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="1" width="3" height="11" rx="1"/></svg>
        <svg class="wifi" viewBox="0 0 16 12" width="16" height="12"><path d="M8 10.4a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/><path d="M4.8 7.2a4.5 4.5 0 0 1 6.4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 4.4a8.5 8.5 0 0 1 12 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="battery"><i></i></span>
      </span>
    </div>

    <!-- 导航栏 -->
    <header class="nav" id="nav">
      <button class="nav-back" id="navBack" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nav-title" id="navTitle"><span id="navName">日出小队</span><span class="nav-count" id="navCount">(5)</span></div>
      <button class="nav-more" id="navMore" aria-label="更多">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </header>

    <!-- 聊天区 -->
    <main class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
    </main>

    <!-- 正在输入 -->
    <div class="typing" id="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span><em id="typingWho">对方正在输入</em></div>

    <!-- 提示条 -->
    <div class="hint" id="hint"></div>

    <!-- 输入区 -->
    <div class="composer" id="composer">
      <button class="ic-btn voice-btn" id="voiceBtn" aria-label="语音">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <textarea id="input" class="input" rows="1" autocomplete="off" enterkeyhint="send" placeholder="" title="Enter 发送，Shift+Enter 换行"></textarea>
      <button class="ic-btn" id="emojiBtn" aria-label="表情">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.1"/><circle cx="15" cy="10" r="1.1"/><path d="M8.6 14.2a4.2 4.2 0 0 0 6.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="ic-btn" id="plusBtn" aria-label="更多">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8.4v7.2M8.4 12h7.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>

    <!-- 扩展面板 -->
    <div class="panel" id="panel">
      <div class="panel-grid">
        <button class="panel-item" data-act="photo"><span class="pi-icon">🖼</span><span>照片</span></button>
        <button class="panel-item" data-act="location"><span class="pi-icon">📍</span><span>位置</span></button>
        <button class="panel-item" data-act="call"><span class="pi-icon">📞</span><span>语音通话</span></button>
        <button class="panel-item" data-act="recall"><span class="pi-icon">↩️</span><span>撤回</span></button>
        <button class="panel-item" data-act="note"><span class="pi-icon">📌</span><span>群公告</span></button>
      </div>
    </div>

    <!-- 下拉：群信息 / 私聊 / 搜索 -->
    <section class="view view-info" id="viewInfo">
      <header class="nav sub">
        <button class="nav-back" data-close="viewInfo"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="nav-title">聊天信息</div>
        <div class="nav-more"></div>
      </header>
      <div class="view-body">
        <div class="members-block">
          <div class="members" id="memberList"></div>
          <div class="member-hint" id="memberHint"></div>
        </div>
        <div class="cell-group">
          <button class="cell" id="cellNotice"><span>群公告</span><span class="cell-arrow">›</span></button>
          <button class="cell" id="cellSearch"><span>查找聊天记录</span><span class="cell-arrow">›</span></button>
          <div class="cell"><span>群聊名称</span><span class="cell-val" id="cellGroupName">日出小队</span></div>
        </div>
        <div class="cell-group">
          <div class="cell"><span>消息免打扰</span><span class="switch on"></span></div>
          <div class="cell"><span>置顶聊天</span><span class="switch on"></span></div>
        </div>
        <div class="cell-group">
          <button class="cell danger" id="cellQuit">删除并退出</button>
        </div>
        <div class="footer-note">本群由 老K 于 11月16日 23:47 创建</div>
      </div>
    </section>

    <section class="view view-search" id="viewSearch">
      <header class="nav sub">
        <button class="nav-back" data-close="viewSearch"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="search-wrap"><input id="searchInput" placeholder="搜索"></div>
        <div class="nav-more nav-cancel" data-close="viewSearch">取消</div>
      </header>
      <div class="view-body search-results" id="searchResults"></div>
    </section>

    <section class="view view-notice" id="viewNotice">
      <header class="nav sub">
        <button class="nav-back" data-close="viewNotice"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="nav-title">群公告</div>
        <div class="nav-more"></div>
      </header>
      <div class="view-body">
        <div class="notice-card">
          <div class="notice-from" id="noticeFrom">老K</div>
          <div class="notice-text" id="noticeText"></div>
          <div class="notice-meta" id="noticeMeta"></div>
        </div>
        <div class="notice-log" id="noticeLog"></div>
      </div>
    </section>

    <section class="view view-private" id="viewPrivate">
      <header class="nav sub">
        <button class="nav-back" data-close="viewPrivate"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="nav-title" id="privTitle">聊天</div>
        <div class="nav-more"></div>
      </header>
      <div class="chat" id="privChat"><div class="chat-inner" id="privInner"></div></div>
      <div class="composer">
        <textarea id="privInput" class="input" rows="1" autocomplete="off" enterkeyhint="send" placeholder="" title="Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="privSend">发送</button>
      </div>
    </section>

    <!-- 位置大图 -->
    <div class="map-modal" id="mapModal">
      <div class="map-head"><button data-close="mapModal">‹ 返回</button><span id="mapTitle">位置</span><span></span></div>
      <div class="map-canvas" id="mapCanvas"></div>
      <div class="map-card">
        <div class="map-card-name" id="mapName"></div>
        <div class="map-card-addr" id="mapAddr"></div>
        <div class="map-card-meta" id="mapMeta"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="outside">
    <div class="outside-title" id="outsideTitle">群聊解密</div>
    <div class="outside-sub">你的每一句话都会有人回应</div>
    <div class="outside-actions">
      <a class="reset" id="backHome" href="/">剧本列表</a>
      <button class="reset" id="reset">重新开始</button>
      <button class="reset" id="export">导出对话</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
